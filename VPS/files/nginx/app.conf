# /etc/nginx/sites-available/app.conf: Nginx reverse proxy (alternative to Caddy).
# 1) Deploy this, 2) sudo nginx -t && sudo systemctl reload nginx,
# 3) sudo certbot --nginx -d example.com -d www.example.com   (certbot adds the TLS lines and the 80→443 redirect)

upstream app_backend {
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    # server 127.0.0.1:3001;   # second replica
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # Let certbot's HTTP-01 challenge through
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;   # websockets
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }

    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # After HTTPS works everywhere:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
