# /etc/haproxy/haproxy.cfg: TLS-terminating load balancer in front of several app VPSes (over private/WireGuard IPs).
# Cert: a combined PEM (fullchain + key) per domain in /etc/haproxy/certs/ (e.g. from certbot with a deploy hook that concatenates them).
# Validate: haproxy -c -f /etc/haproxy/haproxy.cfg
global
    log /dev/log local0
    maxconn 20000
    user haproxy
    group haproxy
    daemon
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    retries 2

frontend http_in
    bind :80
    http-request redirect scheme https code 301 unless { path_beg /.well-known/acme-challenge/ }
    use_backend acme if { path_beg /.well-known/acme-challenge/ }

frontend https_in
    bind :443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    default_backend app

backend app
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    cookie SRV insert indirect nocache          # optional sticky sessions. Prefer stateless apps
    server web-01 10.210.0.1:3000 check inter 5s fall 3 rise 2 cookie w1
    server web-02 10.210.0.2:3000 check inter 5s fall 3 rise 2 cookie w2

backend acme
    server certbot 127.0.0.1:8888               # certbot --standalone --http-01-port 8888

listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /
