# .github/workflows/deploy.yml: test → build image (tag = SHA) → push to GHCR → deploy over SSH → health check → auto-rollback
# GitHub Environment "production":
#   Secret  : SSH_PRIVATE_KEY. YOU set it:  gh secret set SSH_PRIVATE_KEY --env production < ~/.ssh/deploy_ci
#   Variables: SSH_HOST, SSH_USER, SSH_KNOWN_HOSTS (output of: ssh-keyscan -t ed25519 <host>)
# Server: /opt/stacks/myapp has compose.yaml + RELEASE (non-secret image tag) and runs as stack@myapp.service,
# which injects secrets from the secret manager (Server-Setup/SECRETS.md). No .env anywhere.
# The deploy user may only restart that unit:  /etc/sudoers.d/deploy-stack →
#   deploy ALL=(root) NOPASSWD: /usr/bin/systemctl restart stack@myapp, /usr/bin/systemctl status stack@myapp
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/myapp

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          echo "replace with your test command, e.g. npm ci && npm test"

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production        # add required reviewers in repo settings
    steps:
      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ vars.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy with health check and rollback
        env:
          HOST: ${{ vars.SSH_HOST }}
          USER: ${{ vars.SSH_USER }}
          TAG: ${{ github.sha }}
        run: |
          ssh "$USER@$HOST" TAG="$TAG" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/stacks/myapp
          PREV=$(cat RELEASE 2>/dev/null || echo latest)
          echo "$TAG" > RELEASE
          # stack@myapp pulls secrets from the secret manager and runs `docker compose up -d --wait`
          if sudo /usr/bin/systemctl restart stack@myapp; then
            echo "healthy: $TAG"; docker image prune -f >/dev/null; exit 0
          fi
          echo "Deploy/health check failed, rolling back to $PREV" >&2
          echo "$PREV" > RELEASE
          sudo /usr/bin/systemctl restart stack@myapp
          exit 1
          EOF
