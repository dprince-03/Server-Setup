#cloud-config
# Paste into the VPS provider's "User data" / "Cloud config" box when creating the server.
# Edit: the username, ssh_authorized_keys, and hostname. Works on Ubuntu LTS / Debian cloud images.
# After boot:  ssh deploy@<ip> 'cloud-init status --wait'

hostname: web-01
timezone: UTC
package_update: true
package_upgrade: true
package_reboot_if_required: true

users:
  - name: deploy
    groups: [sudo, ssh-users]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"    # remove later and set a password if you prefer sudo prompts
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAREPLACE_WITH_YOUR_PUBLIC_KEY you@laptop

groups: [ssh-users]

ssh_pwauth: false
disable_root: true

packages:
  - ufw
  - fail2ban
  - unattended-upgrades
  - needrestart
  - curl
  - ca-certificates
  - gnupg
  - jq
  - htop
  - ncdu
  - restic

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    permissions: "0644"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      AuthenticationMethods publickey
      AllowGroups ssh-users
      MaxAuthTries 3
      LoginGraceTime 20
      X11Forwarding no
      AllowAgentForwarding no
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    permissions: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/fail2ban/jail.local
    permissions: "0644"
    content: |
      [DEFAULT]
      bantime = 1h
      bantime.increment = true
      backend = systemd
      [sshd]
      enabled = true
  - path: /etc/docker/daemon.json
    permissions: "0644"
    content: |
      { "log-driver": "json-file", "log-opts": { "max-size": "20m", "max-file": "5" }, "live-restore": true }

runcmd:
  # Firewall: SSH first, then web. Restrict SSH to your IP/VPN later: ufw delete limit 22/tcp && ufw allow from <cidr> to any port 22
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw limit 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl enable --now fail2ban
  - systemctl reload ssh || systemctl reload sshd
  # Docker Engine from Docker's official repo
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL "https://download.docker.com/linux/$(. /etc/os-release; echo $ID)/gpg" -o /etc/apt/keyrings/docker.asc
  - sh -c '. /etc/os-release; echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/$ID $VERSION_CODENAME stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - usermod -aG docker deploy
  - mkdir -p /opt/stacks && chown deploy:deploy /opt/stacks

final_message: "Bootstrap finished after $UPTIME seconds"
