# /etc/ssh/sshd_config.d/99-hardening.conf
# Drop-in SSH hardening. Validate with `sshd -t`, then reload, then TEST A NEW SESSION
# before closing your current one.

Port 22
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no

# Only members of this group may log in (bootstrap-server.sh creates it)
AllowGroups ssh-users

MaxAuthTries 3
MaxSessions 5
LoginGraceTime 20
ClientAliveInterval 300
ClientAliveCountMax 2

X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no        # set to "yes" on bastion/jump hosts or if you use SSH tunnels
PermitTunnel no
GatewayPorts no

# Log enough to audit logins
LogLevel VERBOSE
