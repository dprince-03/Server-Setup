---
# Install Docker Engine from Docker's official APT repo (Ubuntu/Debian).
- name: Docker hosts
  hosts: docker_hosts
  become: true
  tasks:
    - name: Remove conflicting distro packages
      ansible.builtin.apt:
        name: [docker.io, docker-doc, docker-compose, podman-docker, containerd, runc]
        state: absent

    - name: Keyrings dir
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Docker GPG key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Docker repo
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Docker packages (latest)
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: latest
        update_cache: true

    - name: Daemon config (log rotation; keeps disks from filling)
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": { "max-size": "20m", "max-file": "5" },
            "live-restore": true
          }
      notify: Restart docker

    - name: Docker running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Stacks directory
      ansible.builtin.file:
        path: /opt/stacks
        state: directory
        mode: "0750"

  handlers:
    - name: Restart docker
      ansible.builtin.service:
        name: docker
        state: restarted
