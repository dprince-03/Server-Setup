# Copy to inventory.ini and edit. Groups describe ROLES, which lets playbooks target them.

[hypervisors]
pve-01 ansible_host=10.10.10.11
pve-02 ansible_host=10.10.10.12
pve-03 ansible_host=10.10.10.13

[docker_hosts]
app-01 ansible_host=10.10.20.11
app-02 ansible_host=10.10.20.12

[databases]
db-01 ansible_host=10.10.20.21

[monitoring]
mon-01 ansible_host=10.10.20.31

# Remote VPSes reached over WireGuard/Tailscale IPs
[vps]
vps-fra-01 ansible_host=100.64.0.11
vps-nyc-01 ansible_host=100.64.0.12

[linux:children]
docker_hosts
databases
monitoring
vps

[linux:vars]
ansible_user=deploy
ansible_become=true
