# Route alerts to email (edit the SMTP settings) and, optionally, a webhook (ntfy/Slack/Discord bridge).
global:
  smtp_smarthost: "smtp.example.com:587"
  smtp_from: "alerts@example.com"
  smtp_auth_username: "alerts@example.com"
  smtp_auth_password_file: /run/secrets/smtp_password   # injected from the secret manager via compose secrets
  smtp_require_tls: true

route:
  receiver: email
  group_by: [alertname, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: [severity="critical"]
      receiver: email
      repeat_interval: 1h

receivers:
  - name: email
    email_configs:
      - to: "ops@example.com"
        send_resolved: true
  # - name: ntfy
  #   webhook_configs:
  #     - url: "https://ntfy.example.com/alerts"   # via a small bridge, or use Grafana alerting's native ntfy/Telegram contact points

inhibit_rules:
  - source_matchers: [alertname="HostDown"]
    target_matchers: [severity="warning"]
    equal: [instance]
